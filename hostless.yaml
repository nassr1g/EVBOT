# ملف إعدادات اختياري لـ Hostless.
# لاحظ: HOST و PORT يُضبطان تلقائياً من Hostless نفسه (0.0.0.0:8000) بحسب
# ما ذكرته لوحة التحكم صراحة، لذا لا نكررهما هنا كقيم ثابتة.
# هذا الملف اختياري بالكامل — إذا رفض Hostless الصيغة أو تجاهلها، احذفه؛
# التطبيق سيعمل بالاعتماد فقط على إعدادات لوحة التحكم (Start Command، إلخ).

healthCheck:
  path: /
  # خادم keepalive.js يرد "Bot is alive ✅" بأي طلب على أي مسار، فالجذر يكفي
